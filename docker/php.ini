; Le code ne change pas dans une image construite : opcache peut travailler à
; plein régime et cesser de vérifier les dates de modification des fichiers.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=20000

; Les fichiers arrivent par morceaux de 8 Mo (DROP_CHUNK_BYTES), jamais en une
; seule requête : ces limites portent sur UN morceau, pas sur le fichier. La
; marge laisse changer la taille de morceau sans toucher à l'image.
upload_max_filesize=64M
post_max_size=64M

; Aucune limite de temps sur une requête. FrankenPHP compte le temps réel, pas
; le temps processeur : avec la valeur par défaut (30 s), toute réponse plus
; longue était tuée — un original de 200 Mo servi à un téléphone en 4G, ou un ZIP
; de groupe. Le fichier arrivait alors tronqué, parfois avec un code 200 : la
; pire des pannes pour une application qui promet l'octet près. Ici les réponses
; sont des flux (téléchargements, ZIP) et les dépôts arrivent par morceaux dans
; leur propre requête : rien ne justifie un chronomètre.
max_execution_time=0

; L'aperçu d'une photo de 60 Mpx se décode en mémoire (GD) dans le worker :
; il lui faut de la place — sans quoi le média reste simplement sans aperçu.
memory_limit=512M
expose_php=Off
