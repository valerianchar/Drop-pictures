; Le code ne change pas dans une image construite : opcache peut travailler à
; plein régime et cesser de vérifier les dates de modification des fichiers.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=20000

; Les fichiers arrivent par morceaux de 8 Mo (DROP_CHUNK_BYTES), jamais en une
; seule requête : ces limites portent sur UN morceau, pas sur le fichier. La
; marge laisse changer la taille de morceau sans toucher à l'image.
upload_max_filesize=64M
post_max_size=64M

; L'aperçu d'une photo de 60 Mpx se décode en mémoire (GD) dans le worker :
; il lui faut de la place — sans quoi le média reste simplement sans aperçu.
memory_limit=512M
expose_php=Off
